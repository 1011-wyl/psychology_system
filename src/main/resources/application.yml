spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/PsychologicalPlatform?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:psychology}
    password: ${DB_PASSWORD:change-me}
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis:
  # 必须配置：指定XML文件的位置
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.cykj.psychology.entity
  configuration:
    #日志实现，可在控制台查看mybatis执行的语句和参数
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    # 开启驼峰命名转换
    map-underscore-to-camel-case: true

server:
  port: 8080

security:
  jwt:
    # 仅供本地开发；生产配置必须通过 JWT_SECRET 覆盖。
    secret: ${JWT_SECRET:local-development-jwt-secret-change-me-2026}
    expire-millis: ${JWT_EXPIRE_MILLIS:86400000}

app:
  cors:
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*,http://192.168.*:*,http://10.*:*,http://172.*:*}

payment:
  # 未接入真实支付回调前，默认禁止客户端直接增加余额。
  demo-recharge-enabled: ${DEMO_RECHARGE_ENABLED:true}

